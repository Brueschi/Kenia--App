name: Generate weekly article audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'briefings/**.md'
      - 'briefings/**.json'
      - 'data/issues.json'
      - 'scripts/generate_audio.py'
      - '.github/workflows/article-audio.yml'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install piper-tts
      - name: Install MP3 encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/generate_audio.py
      - name: Publish generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "Generate audio for weekly editions"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            echo "Could not publish generated audio after 5 attempts" >&2
            exit 1
          fi

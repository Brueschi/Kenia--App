name: Generate weekly article audio
on:
  workflow_dispatch:
  push:
    paths:
      - 'briefings/**.md'
      - 'briefings/**.json'
      - 'data/issues.json'
      - 'scripts/generate_audio.py'
permissions:
  contents: write
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install piper-tts
      - name: Install MP3 encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python scripts/generate_audio.py
      - name: Publish generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/
          git diff --cached --quiet || (git commit -m "Generate audio for weekly editions" && git push)

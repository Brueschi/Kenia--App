<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b28"><meta name="description" content="Kenia Weekly – Hintergründe, Politik, Gesellschaft und Luo-Kultur."><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css?v=30"><title>Kenia Weekly</title></head>
<body><div class="shell"><header class="topbar"><a class="brand" href="#home"><span class="mark">K<span class="markdot">.</span></span><span>KENIA <strong>WEEKLY</strong></span></a><button id="refresh" class="iconbutton" aria-label="Ausgaben aktualisieren" title="Aktualisieren">↻</button></header><div class="layout"><aside class="sidebar"><div class="side-label">NACHSCHLAGEWERK</div><nav aria-label="Hauptnavigation"><a href="#home" data-nav="home">Übersicht</a><a data-chapter="1" href="#chapter/1">Wahlen 2027</a><a data-chapter="2" href="#chapter/2">Politik</a><a data-chapter="3" href="#chapter/3">Gesellschaft</a><a data-chapter="4" href="#chapter/4">Geschichte</a><a data-chapter="5" href="#chapter/5">Persönlichkeiten</a><a data-chapter="6" href="#luo" data-nav="luo">Luo & Nyanza</a><a href="#archive" data-nav="archive">Wochenarchiv</a><a href="#language" data-nav="language">Sprachen</a><a href="#saved" data-nav="saved">Merkliste</a></nav><div class="side-bottom"><span class="live-dot"></span><span id="syncLabel">Ausgaben werden geladen</span></div></aside><main id="app" tabindex="-1"><div class="loading">Kenia Weekly wird geladen …</div></main></div><footer>KENIA WEEKLY <span>Unabhängig lesen. Hintergründe verstehen.</span></footer></div><script>window.addEventListener("error",function(e){const el=document.getElementById("app");if(el&&el.textContent.includes("wird geladen"))el.innerHTML="<div class=\"empty\">Fehler beim Start: "+String(e.message).replace(/[<>]/g,"")+"</div>"});if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{})}</script><script>
function cleanChapterTitle(title){return String(title||'').replace(/^\s*(?:\d+\s*[.\-–]\s*)?(?:Wahlen\s*2027|Weitere\s+Politik|Politik(?:\s*&\s*Institutionen)?|Gesellschaft(?:\s*&\s*Wirtschaft)?|Historisches\s+Thema|Geschichte(?:\s*&\s*Hintergründe)?|Kenianische\s+Persönlichkeit|Persönlichkeit(?:en)?|Menschen\s*&\s*Persönlichkeiten|Die\s+Luo|Luo(?:\s+in\s+Kenia)?(?:\s*&\s*Nyanza)?)\s*[:–—-]\s*/i,'')}
function chapterPhoto(issue,n){return imageState.chapter_images?.[String(n)]||photoFor(issue,n)}function entryUrl(issue,n){return '#entry/'+encodeURIComponent(issue.id)+'/'+n}function articleFromBriefing(issue,part){return '<article class="briefing-chapter">'+photoMarkup(chapterPhoto(issue,part.n),'chapter')+'<div class="article-meta">'+escapeHtml(issue.title)+' · '+escapeHtml(issue.date||'')+(issue.test?' · TESTAUSGABE':'')+'</div><div class="article">'+markdown(part.body.replace(new RegExp('^(#{1,3}\\s+)(?:\\d+\\s*[.\\-–]\\s*)?'+ '(?:Wahlen\s*2027|Weitere\s+Politik|Politik(?:\s*&\s*Institutionen)?|Gesellschaft(?:\s*&\s*Wirtschaft)?|Historisches\s+Thema|Geschichte(?:\s*&\s*Hintergründe)?|Kenianische\s+Persönlichkeit|Persönlichkeit(?:en)?|Menschen\s*&\s*Persönlichkeiten|Die\s+Luo|Luo(?:\s+in\s+Kenia)?(?:\s*&\s*Nyanza)?)'+ '\\s*[:–—-]\\s*','im'),'$1'))+'</div><a class="smallcap" href="#issue/'+encodeURIComponent(issue.id)+'">Ganzes Wochenbriefing →</a></article>'}async function directEntry(id,n){const issue=state.issues.find(x=>x.id===id);if(!issue){app.innerHTML='<div class="empty">Ausgabe nicht gefunden.</div>';return}app.innerHTML='<div class="loading">Beitrag wird geladen …</div>';try{const part=chapterSections(await loadText(issue)).find(x=>x.n===n);if(!part)throw Error('Kapitel nicht vorhanden');app.innerHTML='<a class="smallcap" href="#chapter/'+n+'">← Kapitelübersicht</a>'+articleFromBriefing(issue,part)}catch(e){app.innerHTML='<div class="empty">Beitrag konnte nicht geladen werden.</div>'}}async function directChapter(n){const title=knowledge.chapters.find(c=>c.id===n)?.title||chapterNames[n-1];app.innerHTML='<a class="smallcap" href="#home">← Übersicht</a><span class="eyebrow">KAPITEL '+String(n).padStart(2,'0')+'</span><h1 class="page-title">'+escapeHtml(title)+'</h1><div id="directChapter"><div class="loading">Beiträge werden geladen …</div></div>';const entries=(await latestChapterItems()).filter(x=>x.part.n===n);const el=$('#directChapter');if(!el)return;if(!entries.length){el.innerHTML='<div class="empty">Noch keine Beiträge.</div>';return}const [newest,...older]=entries;el.innerHTML=articleFromBriefing(newest.issue,newest.part)+'<div class="section-head"><div><span class="eyebrow">WEITERE BEITRÄGE</span><h2>Inhaltsübersicht</h2></div></div>'+(older.length?'<div class="older-list">'+older.map(({issue,part})=>'<a class="older-item" href="'+entryUrl(issue,n)+'"><span class="tag">'+(issue.test?'TESTAUSGABE':'WOCHENBRIEFING')+'</span><h3>'+escapeHtml(part.title)+'</h3><p>'+escapeHtml(shortIntro(part.body,165))+'</p><span class="smallcap">Beitrag lesen →</span></a>').join('')+'</div>':'<p class="knowledge-note">Noch keine älteren Beiträge in diesem Kapitel.</p>')}async function directHome(){app.innerHTML='<div class="overview-date" id="overviewDate">Letzte Ausgabe wird geladen …</div><div id="latestStories"><div class="loading">Beiträge werden geladen …</div></div>';const newest=state.issues[0];if(!newest){$('#overviewDate').textContent='';$('#latestStories').innerHTML='<div class="empty">Noch keine Ausgaben.</div>';return}try{const source=await loadText(newest),parts=chapterSections(source);const m=source.match(/(?:Redaktionsstand|Redaktioneller Stand)\s*:\s*(?:\*\*)?\s*(\d{1,2}\.\s*[A-Za-zÄÖÜäöü]+\s+\d{4})/i);const date=newest.date||m?.[1]||'Datum nicht angegeben';$('#overviewDate').textContent='Letzte Ausgabe: '+date+(newest.test?' · Testausgabe':'');$('#latestStories').innerHTML='<div class="latest-grid">'+parts.map(p=>'<article class="latest-story"><div class="latest-topic">'+escapeHtml((knowledge.chapters.find(c=>c.id===p.n)?.title)||chapterNames[p.n-1])+'</div>'+photoMarkup(chapterPhoto(newest,p.n),'card-photo')+'<div class="latest-copy"><h3>'+escapeHtml(p.title.replace(/^[^:]{1,55}:\s*/,''))+'</h3><p>'+escapeHtml(shortIntro(p.body))+'</p><a class="button secondary" href="'+entryUrl(newest,p.n)+'">Artikel lesen →</a></div></article>').join('')+'</div>'}catch(e){$('#overviewDate').textContent='';$('#latestStories').innerHTML='<div class="empty">Beiträge konnten nicht geladen werden.</div>'}}

function shortIntro(body,max=240){const plain=String(body??'').replace(/^#{1,6}[^\n]*\n/gm,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\*\*/g,'').replace(/\s+/g,' ').trim();return plain.length>max?plain.slice(0,max).replace(/\s+\S*$/,'')+' …':plain}async function latestChapterItems(){return(await Promise.all(state.issues.map(async issue=>{try{return{issue,parts:chapterSections(await loadText(issue))}}catch{return{issue,parts:[]}}}))).flatMap(({issue,parts})=>parts.map(part=>({issue,part})))}
const knowledge={chapters:[],articles:[]};function chapterCards(){return '<div class="knowledge-grid">'+knowledge.chapters.map(c=>'<a class="knowledge-tile" href="#chapter/'+c.id+'"><span class="eyebrow">KAPITEL '+String(c.id).padStart(2,'0')+'</span><h3>'+escapeHtml(c.title)+'</h3><p>'+escapeHtml(c.topics.join(' · '))+'</p><span class="smallcap">Kapitel erkunden →</span></a>').join('')+'</div>'}function knowledgeHome(){const x=state.issues[0];app.innerHTML='<section class="hero"><span class="eyebrow">KENIA VERSTEHEN</span><h1>Ein Land. Viele Perspektiven.</h1><p>Ein wachsendes Nachschlagewerk über Politik, Gesellschaft, Geschichte und Kultur Kenias.</p><a class="button" href="#chapter/1">Wissen entdecken →</a></section><div class="section-head"><div><span class="eyebrow">NACHSCHLAGEWERK</span><h2>Die sechs Kapitel</h2></div></div>'+chapterCards()+'<div class="section-head"><div><span class="eyebrow">AKTUELLE ENTWICKLUNGEN</span><h2>Wochenbriefings</h2></div><a href="#archive">Alle Ausgaben →</a></div>'+issueList(state.issues.slice(0,3))+'<p class="knowledge-note">Die Wissensartikel werden schrittweise aufgebaut und erst nach Quellenprüfung als vollständig gekennzeichnet.</p>'}function knowledgeArticle(id){const a=knowledge.articles.find(x=>x.id===id);if(!a){app.innerHTML='<div class="empty">Artikel nicht gefunden.</div>';return}const c=knowledge.chapters.find(x=>x.id===a.chapter);app.innerHTML='<a class="smallcap" href="#chapter/'+a.chapter+'">← '+escapeHtml(c?.title||'Kapitel')+'</a><article class="article knowledge-article"><span class="eyebrow">NACHSCHLAGEWERK · KAPITEL '+a.chapter+'</span><h1>'+escapeHtml(a.title)+'</h1><p>'+escapeHtml(a.summary)+'</p><div class="notice">Grundlagenartikel in Arbeit · Stand '+escapeHtml(a.updated)+' · Inhalt noch nicht fachlich geprüft</div>'+markdown(a.body)+'<p><a class="button secondary" href="#chapter/'+a.chapter+'">Beiträge aus den Wochenbriefings ansehen →</a></p></article>'}function knowledgeChapter(n){const c=knowledge.chapters.find(x=>x.id===n);if(!c){app.innerHTML='<div class="empty">Kapitel nicht gefunden.</div>';return}const articles=knowledge.articles.filter(x=>x.chapter===n);app.innerHTML='<a class="smallcap" href="#home">← Nachschlagewerk</a><span class="eyebrow">KAPITEL '+String(n).padStart(2,'0')+'</span><h1 class="page-title">'+escapeHtml(c.title)+'</h1><p>Grundlagen, Hintergründe und alle Beiträge zu diesem Themenbereich.</p><div class="section-head"><div><span class="eyebrow">WISSENSARTIKEL</span><h2>Unterthemen</h2></div></div><div class="knowledge-grid">'+articles.map(a=>'<a class="knowledge-tile" href="#article/'+a.id+'"><span class="tag">IM AUFBAU</span><h3>'+escapeHtml(a.title)+'</h3><p>'+escapeHtml(a.summary)+'</p><span class="smallcap">Artikel öffnen →</span></a>').join('')+'</div><div class="section-head"><div><span class="eyebrow">QUELLENARCHIV</span><h2>Beiträge aus den Wochenbriefings</h2></div></div><div id="topicList" class="list"><div class="loading">Beiträge werden geladen …</div></div>';Promise.all(state.issues.map(async issue=>{try{const txt=await loadText(issue);const p=chapterSections(txt).find(p=>p.n===n);return p?{issue,part:p}:null}catch{return null}})).then(items=>{const el=$('#topicList');if(!el)return;const valid=items.filter(Boolean);el.innerHTML=valid.length?valid.map(({issue,part})=>'<article class="card"><span class="tag">'+(issue.test?'TESTAUSGABE':'WOCHENBRIEFING')+'</span><h3>'+escapeHtml(part.title)+'</h3><p>'+escapeHtml(issue.title)+'</p><a class="smallcap" href="#issue/'+encodeURIComponent(issue.id)+'">Ausgabe lesen →</a></article>').join(''):'<div class="empty">Noch keine zugeordneten Beiträge.</div>'})}
const imageState={default_cover:null,issues:{}};function photoFor(issue,n){return (imageState.issues[issue?.id]?.chapters||{})[String(n)]||imageState.issues[issue?.id]?.cover||imageState.default_cover}function photoMarkup(p,variant='chapter'){if(!p||!p.file)return '';const src='https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(p.file)+'?width=800';const href='https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(p.file).replace(/%20/g,'_');return '<figure class="editorial-image '+variant+'"><img loading="lazy" src="'+escapeHtml(src)+'" alt="'+escapeHtml(p.alt||'Kontextbild aus Kenia')+'"><figcaption>'+escapeHtml(p.caption||'Kontextbild')+' · Foto: '+escapeHtml(p.author||'unbekannt')+' · <a href="'+escapeHtml(p.licenseUrl||'#')+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(p.license||'Lizenz')+'</a> · <a href="'+escapeHtml(href)+'" target="_blank" rel="noopener noreferrer">Bildquelle</a></figcaption></figure>'}function photoChapterHTML(text,parts,issue){if(!parts.length)return photoMarkup(photoFor(issue,1),'cover')+markdown(text);let output='',position=0;const rows=text.replace(/\r/g,'').split('\n');for(const p of parts){const prefix=rows.slice(position,p.start).join('\n');if(prefix.trim())output+=markdown(prefix);output+=photoMarkup(photoFor(issue,p.n),'chapter');position=p.start;const end=parts[parts.indexOf(p)+1]?.start??rows.length;output+=markdown(rows.slice(position,end).join('\n'));position=end}return output+markdown(rows.slice(position).join('\n'))}
const state={issues:[],selected:null,content:new Map(),query:''};const $=s=>document.querySelector(s);const app=$('#app');const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const saved=()=>{try{return JSON.parse(localStorage.getItem('kw-saved')||'[]')}catch{return[]}};const saveList=a=>localStorage.setItem('kw-saved',JSON.stringify(a));const slug=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');const inline=s=>{let v=escapeHtml(s);v=v.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,(_,label,url)=>'<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+label+'</a>');v=v.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>');return v};function markdown(src){const lines=String(src??'').replace(/\r/g,'').split('\n');let html='',para=[],list=null,table=[];const flush=()=>{if(para.length){html+='<p>'+inline(para.join(' '))+'</p>';para=[]}if(list){html+='</'+list+'>';list=null}if(table.length){const rows=table.filter(x=>!/^\s*\|?\s*:?-+:?\s*\|/.test(x));html+='<table><tbody>'+rows.map((r,i)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>'<'+(i?'td':'th')+'>'+inline(c.trim())+'</'+(i?'td':'th')+'>').join('')+'</tr>').join('')+'</tbody></table>';table=[]}};for(const raw of lines){const line=raw.trim();if(!line){flush();continue}if(/^\|.+\|$/.test(line)){if(para.length||list){flush()}table.push(line);continue}if(table.length)flush();const h=line.match(/^(#{1,6})\s+(.+)$/);if(h){flush();const level=Math.min(h[1].length,4),title=h[2];html+='<h'+level+' id="'+slug(title)+'">'+inline(title)+'</h'+level+'>';continue}if(/^[-*_]{3,}$/.test(line)){flush();html+='<hr>';continue}if(/^>\s?/.test(line)){flush();html+='<blockquote>'+inline(line.slice(1).trim())+'</blockquote>';continue}const li=line.match(/^([-*]|\d+\.)\s+(.+)$/);if(li){if(para.length)flush();const kind=/\d/.test(li[1])?'ol':'ul';if(list!==kind){flush();html+='<'+kind+'>';list=kind}html+='<li>'+inline(li[2])+'</li>';continue}if(list)flush();para.push(line)}flush();return html}const chapterNames=['Wahlen 2027','Weitere Politik','Gesellschaft','Geschichte','Persönlichkeit','Die Luo'];function chapterSections(text){const rows=text.split('\n');const starts=[];rows.forEach((line,i)=>{const m=line.match(/^#{1,3}\s+(?:Kapitel\s*)?([1-6])[.\s:–-]+(.+)$/i);if(m)starts.push({n:Number(m[1]),title:m[2],start:i})});return starts.filter((x,i,a)=>a.findIndex(z=>z.n===x.n)===i).map((x,i,a)=>({...x,body:rows.slice(x.start,(a[i+1]?.start)||rows.length).join('\n')}))}function issueCard(x){return '<article class="card">'+photoMarkup(photoFor(x,1),'card-photo')+'<span class="tag">'+(x.test?'TESTAUSGABE':'WOCHENBRIEFING')+'</span><h3><a href="#issue/'+encodeURIComponent(x.id)+'">'+escapeHtml(x.title)+'</a></h3><p>'+escapeHtml(x.date||'Sechs Kapitel · Politik, Gesellschaft und Kultur')+'</p><a class="smallcap" href="#issue/'+encodeURIComponent(x.id)+'">Ausgabe lesen →</a></article>'}function issueList(items){return items.length?'<div class="grid">'+items.map(issueCard).join('')+'</div>':'<div class="empty">Keine passenden Ausgaben gefunden.</div>'}function home(){const x=state.issues[0];app.innerHTML='<section class="hero"><span class="eyebrow">DEIN KENIA-MAGAZIN</span><h1>Kenia verstehen.<br>Woche für Woche.</h1><p>Politik, Gesellschaft, Geschichte und die Luo – fundierte Hintergründe an einem Ort. Mit Kiswahili und Dholuo.</p><a class="button" href="'+(x?'#issue/'+encodeURIComponent(x.id):'#archive')+'">Aktuelle Ausgabe lesen →</a></section>'+(state.issues.some(x=>x.test)?'<div class="notice">Testbetrieb: Die mit «Testausgabe» gekennzeichneten Texte sind eigens erstellte Beispiele und keine historischen Wochenbriefings.</div>':'')+'<div class="section-head"><div><span class="eyebrow">LESEN & ENTDECKEN</span><h2>Ausgaben</h2></div><a href="#archive">Zum Archiv →</a></div>'+issueList(state.issues.slice(0,3))+'<div class="section-head"><div><span class="eyebrow">SECHS PERSPEKTIVEN</span><h2>Unsere Themen</h2></div></div><div class="chapter-index">'+chapterNames.map((n,i)=>'<a class="chapter-link" href="#chapter/'+(i+1)+'"><span class="number">0'+(i+1)+'</span>'+n+' <span aria-hidden="true">→</span></a>').join('')+'</div>'}function archive(){app.innerHTML='<span class="eyebrow">ALLE AUSGABEN</span><h1 class="page-title">Das Archiv</h1><p>Alle verfügbaren Kenia-Briefings an einem Ort.</p><div class="toolbar"><input id="search" class="search" type="search" placeholder="Ausgaben durchsuchen …" value="'+escapeHtml(state.query)+'"></div><div id="results">'+issueList(state.issues.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase())))+'</div>';$('#search').addEventListener('input',e=>{state.query=e.target.value;$('#results').innerHTML=issueList(state.issues.filter(x=>x.title.toLowerCase().includes(state.query.toLowerCase())))})}async function loadText(issue){if(state.content.has(issue.id))return state.content.get(issue.id);const res=await fetch('./'+issue.markdown_path,{cache:'no-cache'});if(!res.ok)throw Error('Ausgabe nicht verfügbar ('+res.status+')');const t=await res.text();state.content.set(issue.id,t);return t}function navChapters(parts){return parts.length?'<div class="subnav">'+parts.map(p=>'<a href="#'+slug(p.title)+'">'+p.n+'. '+escapeHtml(p.title)+'</a>').join('')+'</div>':''}async function issueView(id){const issue=state.issues.find(x=>x.id===id);if(!issue){app.innerHTML='<div class="empty">Ausgabe nicht gefunden. <a href="#archive">Zum Archiv</a></div>';return}app.innerHTML='<div class="loading">Ausgabe wird geladen …</div>';try{const txt=await loadText(issue),parts=chapterSections(txt),isSaved=saved().includes(id);app.innerHTML='<a class="smallcap" href="#archive">← Alle Ausgaben</a><div class="toolbar"><span class="tag">'+(issue.test?'TESTAUSGABE':'WOCHENBRIEFING')+'</span><button class="button ghost" id="bookmark">'+(isSaved?'Aus Merkliste entfernen':'Ausgabe merken')+'</button></div><article class="article">'+photoMarkup(imageState.issues[issue.id]?.cover||imageState.default_cover,'cover')+navChapters(parts)+photoChapterHTML(txt,parts,issue)+'</article>';$('#bookmark').onclick=()=>{let a=saved();a=a.includes(id)?a.filter(x=>x!==id):[...a,id];saveList(a);$('#bookmark').textContent=a.includes(id)?'Aus Merkliste entfernen':'Ausgabe merken'}}catch(e){app.innerHTML='<div class="empty">Diese Ausgabe konnte nicht geladen werden. '+escapeHtml(e.message)+' <button id="retry" class="button secondary">Erneut versuchen</button></div>';$('#retry').onclick=()=>issueView(id)}}async function topic(n){app.innerHTML='<span class="eyebrow">THEMENSAMMLUNG</span><h1 class="page-title">'+escapeHtml(chapterNames[n-1])+'</h1><p>Beiträge aus allen verfügbaren Ausgaben.</p><div id="topicList" class="list"><div class="loading">Kapitel werden geladen …</div></div>';const items=await Promise.all(state.issues.map(async issue=>{try{const text=await loadText(issue);const parts=chapterSections(text);const p=parts.find(x=>x.n===n);return p?{issue,part:p}:null}catch{return null}}));const valid=items.filter(Boolean);$('#topicList').innerHTML=valid.length?valid.map(({issue,part})=>'<article class="card"><div><span class="tag">'+(issue.test?'TEST':'AUSGABE')+'</span><h3>'+escapeHtml(part.title)+'</h3><p>'+escapeHtml(issue.title)+'</p></div><a class="button secondary" href="#issue/'+encodeURIComponent(issue.id)+'">Lesen →</a></article>').join(''):'<div class="empty">Noch keine Kapitel gefunden. Die Ausgabe ist dennoch über das Archiv vollständig lesbar.</div>'}function savedView(){app.innerHTML='<span class="eyebrow">FÜR SPÄTER</span><h1 class="page-title">Deine Merkliste</h1><p>Gespeichert auf diesem Gerät.</p>'+issueList(state.issues.filter(x=>saved().includes(x.id)))}async function languageSection(text){const lines=String(text||'').replace(/\r/g,'').split('\n');let start=-1;for(let i=0;i<lines.length;i++){if(/^#{2,3}\s*(?:Kiswahili\b|Muhtasari\b|Kurze Zusammenfassung auf einfachem Kiswahili\b)/i.test(lines[i]))start=i}if(start<0)return null;let end=lines.length;for(let i=start+1;i<lines.length;i++){if(/^#{1,2}\s+/.test(lines[i])||/^\*?Redaktioneller Hinweis:/i.test(lines[i])){end=i;break}}return{title:lines[start].replace(/^#{2,3}\s*/,''),body:lines.slice(start+1,end).join('\n').replace(/\n---\s*$/,'').trim()}}const languageCache={};function languageIssueLabel(issue){return issue.date||('Testausgabe '+String(issue.id||'').split('-').pop())}async function getLanguageEntries(){if(!languageCache.all)languageCache.all=Promise.all(state.issues.map(async issue=>{try{const section=languageSection(await loadText(issue));return section?{issue,section}:null}catch(e){console.error('Sprachquelle',issue.id,e);return null}})).then(rows=>rows.filter(Boolean));return languageCache.all}function languageCard(x){return '<a class="mini-article" href="#language-entry/'+encodeURIComponent(x.issue.id)+'"><span class="mini-article-date">'+escapeHtml(languageIssueLabel(x.issue))+'</span><h3>'+escapeHtml(x.section.title||'Kiswahili')+'</h3><p>'+escapeHtml(shortIntro(x.section.body,125))+'</p><span class="smallcap">Lesen →</span></a>'}async function languageEntry(id){app.innerHTML='<div class="loading">Sprachbeitrag wird geladen …</div>';try{const rows=await getLanguageEntries();const item=rows.find(x=>x.issue.id===id);if(!item){app.innerHTML='<div class="empty">Sprachbeitrag nicht gefunden.</div>';return}const section=languageSection(await loadText(item.issue));const body=String(section?.body||item.section.body||'');const content=body.trim()?markdown(body):'<p>Kein Sprachtext gefunden.</p>';app.innerHTML='<a class="smallcap" href="#language">← Sprachen</a><h1 class="page-title">'+escapeHtml(item.section.title||'Kiswahili')+'</h1><p class="article-meta">'+escapeHtml(languageIssueLabel(item.issue))+'</p><div class="article">'+content+'</div>';const article=app.querySelector('.article');if(article&&!article.textContent.trim())article.textContent=body||'Kein Sprachtext vorhanden.'}catch(e){console.error('Sprachbeitrag',e);app.innerHTML='<div class="empty">Sprachbeitrag konnte nicht geladen werden: '+escapeHtml(e.message)+'</div>'}}async function languageAll(){app.innerHTML='<a class="smallcap" href="#language">← Sprachen</a><h1 class="page-title">Alle Sprachbeiträge</h1><div id="languageCards" class="mini-article-grid"><div class="loading">Sprachbeiträge werden geladen …</div></div>';try{const rows=await getLanguageEntries();const el=document.getElementById('languageCards');if(el)el.innerHTML=rows.map(languageCard).join('')||'<p>Noch keine Sprachbeiträge vorhanden.</p>'}catch(e){console.error(e);const el=document.getElementById('languageCards');if(el)el.textContent='Sprachbeiträge konnten nicht geladen werden: '+e.message}}async function language(){app.innerHTML='<h1 class="page-title">Sprachen</h1><p>Kiswahili und Dholuo: Sprachabschnitte aus den Wochenbriefings.</p><div id="languageLatest" class="loading">Beiträge werden geladen …</div>';try{const rows=await getLanguageEntries();const el=document.getElementById('languageLatest');if(el)el.innerHTML=rows.length?'<div class="mini-article-grid">'+rows.slice(0,5).map(languageCard).join('')+'</div><a class="smallcap" href="#language-all">Alle Sprachbeiträge anzeigen →</a>':'<p>Noch keine Sprachbeiträge vorhanden.</p>'}catch(e){console.error(e);const el=document.getElementById('languageLatest');if(el)el.textContent='Sprachbeiträge konnten nicht geladen werden: '+e.message}}const chapterCache={};async function getChapterEntries(n){if(!chapterCache[n])chapterCache[n]=latestChapterItems().then(items=>items.filter(x=>x.part.n===n)).catch(()=>[]);return chapterCache[n]}function articleTitle(p){return cleanChapterTitle(p.title).replace(/^\s*(?:Wahlen\s*2027|Politik|Weitere\s+Politik|Gesellschaft|Geschichte|Historisches\s+Thema|Persönlichkeit(?:en)?|Kenianische\s+Persönlichkeit|Luo(?:\s+in\s+Kenia)?)\s*[:–—-]\s*/i,'')}async function updateSidebar(){const nav=document.querySelector('.sidebar nav');if(!nav)return;const hash=decodeURIComponent(location.hash.slice(1)||'home'),route=hash.split('/')[0],chapter=route==='chapter'?Number(hash.split('/')[1]):route==='luo'?6:route==='entry'?Number(hash.split('/')[2]):route==='all'?Number(hash.split('/')[1]):0;nav.querySelectorAll('.chapter-subnav').forEach(x=>x.remove());nav.querySelectorAll('a[data-chapter]').forEach(a=>a.classList.toggle('active',Number(a.dataset.chapter)===chapter));if(!chapter){if(route==='language'||route==='language-entry'||route==='language-all'){const parent=nav.querySelector('a[data-nav="language"]');if(!parent)return;const rows=await getLanguageEntries();if(decodeURIComponent(location.hash.slice(1)||'home')!==hash)return;const sub=document.createElement('div');sub.className='chapter-subnav';sub.innerHTML=rows.slice(0,5).map(x=>'<a href="#language-entry/'+encodeURIComponent(x.issue.id)+'">'+escapeHtml(x.section.title||'Kiswahili')+' · '+escapeHtml(languageIssueLabel(x.issue))+'</a>').join('')+'<a class="all-articles-link" href="#language-all">Alle Sprachbeiträge anzeigen →</a>';parent.insertAdjacentElement('afterend',sub)}return}const parent=nav.querySelector('a[data-chapter="'+chapter+'"]');if(!parent)return;const items=await getChapterEntries(chapter);if(!nav.contains(parent)||decodeURIComponent(location.hash.slice(1)||'home')!==hash)return;const sub=document.createElement('div');sub.className='chapter-subnav';sub.innerHTML=items.slice(0,5).map(({issue,part})=>'<a href="'+entryUrl(issue,chapter)+'" title="'+escapeHtml(articleTitle(part))+'">'+escapeHtml(articleTitle(part))+'</a>').join('')+'<a class="all-articles-link" href="#all/'+chapter+'">Alle Artikel anzeigen →</a>';parent.insertAdjacentElement('afterend',sub)}async function allChapterArticles(n){const c=knowledge.chapters.find(x=>x.id===n);app.innerHTML='<a class="smallcap" href="#chapter/'+n+'">← Zurück zum Kapitel</a><h1 class="page-title">'+escapeHtml(c?.title||chapterNames[n-1])+'</h1><p>Alle Artikel dieses Kapitels, neueste zuerst.</p><div id="allArticleGrid" class="mini-article-grid"><div class="loading">Artikel werden geladen …</div></div>';const items=await getChapterEntries(n);const el=document.getElementById('allArticleGrid');if(!el)return;el.innerHTML=items.length?items.map(({issue,part})=>'<a class="mini-article" href="'+entryUrl(issue,n)+'"><span class="mini-article-date">'+escapeHtml(issue.date||((issue.test?'Testausgabe ':'Ausgabe ')+(issue.id.match(/\d+$/)?.[0]||'')))+'</span><h3>'+escapeHtml(articleTitle(part))+'</h3><p>'+escapeHtml(shortIntro(part.body,140))+'</p><span class="smallcap">Artikel lesen →</span></a>').join(''):'<p>Noch keine Artikel vorhanden.</p>'}
function render(){const hash=decodeURIComponent(location.hash.replace(/^#/,'')||'home');const [route,arg]=hash.split('/');document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===(route==='issue'?'archive':route==='chapter'?'home':route)));window.scrollTo(0,0);updateSidebar();if(route==='all'&&+arg>=1&&+arg<=6)allChapterArticles(+arg);else if(route==='archive')archive();else if(route==='issue')issueView(arg);else if(route==='luo')directChapter(6);else if(route==='chapter'&&+arg>=1&&+arg<=6)directChapter(+arg);else if(route==='entry')directEntry(arg,Number(hash.split('/')[2]));else if(route==='article')knowledgeArticle(arg);else if(route==='language-entry')languageEntry(arg);else if(route==='language-all')languageAll();else if(route==='language')language();else if(route==='saved')savedView();else directHome()}async function init(){try{const res=await fetch('./data/issues.json',{cache:'no-store'});if(!res.ok)throw Error('Index fehlt');const data=await res.json();try{const k=await fetch('./data/knowledge.json',{cache:'no-store'});if(k.ok)Object.assign(knowledge,await k.json())}catch(e){}try{const images=await fetch('./data/images.json',{cache:'no-cache'});if(images.ok)Object.assign(imageState,await images.json())}catch(e){}const rows=await Promise.allSettled((data.issues||[]).map(async row=>{const r=await fetch('./'+row.metadata,{cache:'no-cache'});if(!r.ok)throw Error(row.metadata);const j=await r.json();return {...j,metadata:row.metadata}}));state.issues=rows.filter(x=>x.status==='fulfilled'&&x.value.status==='complete').map(x=>x.value).reverse();$('#syncLabel').textContent=state.issues.length+' Ausgaben verfügbar';render()}catch(e){$('#syncLabel').textContent='Verbindung prüfen';app.innerHTML='<div class="empty">Die Ausgaben konnten nicht geladen werden. Bitte überprüfe die Verbindung und versuche es erneut.</div>'}}window.addEventListener('hashchange',render);$('#refresh').onclick=async()=>{state.content.clear();Object.keys(chapterCache).forEach(k=>delete chapterCache[k]);delete languageCache.all;$('#refresh').textContent='…';await init();$('#refresh').textContent='↻'};init();
